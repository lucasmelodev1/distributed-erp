server {
    listen 80;
    root /usr/share/nginx/html;

    # The API (and GraphiQL in the dev profile) lives on the same origin as the app,
    # so the SESSION cookie works without CORS.
    location /graphql {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /graphiql {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes (/dashboard, /register, ...) fall back to the app shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
