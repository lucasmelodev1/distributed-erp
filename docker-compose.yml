services:
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: demo
      MYSQL_ROOT_PASSWORD: mysql
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pmysql --silent" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
  redis:
    image: redis:8.6.5-alpine
    command: redis-server --requirepass password --appendonly yes
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  grafana:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"
      - "4318:4318"

  # Dev mail catcher: the app sends here, read the messages at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    environment:
      # The app always authenticates; accept any login over plain SMTP.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      # SMTP, for running the app on the host instead of in compose.
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  app:
    build:
      context: .
      target: backend
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # Inside the compose network the services are not on localhost.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-demo}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
      SPRING_REDIS_PASSWORD: password
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      SPRING_MAIL_USERNAME: dev
      SPRING_MAIL_PASSWORD: dev
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      grafana:
        condition: service_started
      mailpit:
        condition: service_started

  frontend:
    build:
      context: .
      target: frontend
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    environment:
      BACKEND_URL: http://app:8080
    depends_on:
      - app

volumes:
  redis_data:
  mysqldata:
