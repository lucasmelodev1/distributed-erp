services:
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: demo
      MYSQL_ROOT_PASSWORD: mysql
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pmysql --silent" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
  redis:
    image: redis:8.6.5-alpine
    command: redis-server --requirepass password --appendonly yes
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  grafana:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"
      - "4318:4318"

  # Single-node KRaft broker, the same Apache Kafka line that AWS MSK runs.
  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      # INTERNAL is for containers in this compose file, EXTERNAL for an app run on the host.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 24
    ports:
      - "${KAFKA_PORT:-9094}:9094"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Dev mail catcher: the app sends here, read the messages at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    environment:
      # The app always authenticates; accept any login over plain SMTP.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      # SMTP, for running the app on the host instead of in compose.
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  app:
    build:
      context: .
      target: backend
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # Base of the links in emails (invitations): the frontend service below.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${FRONTEND_PORT:-8081}}
      # Inside the compose network the services are not on localhost.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-demo}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
      SPRING_REDIS_PASSWORD: password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      SPRING_MAIL_USERNAME: dev
      SPRING_MAIL_PASSWORD: dev
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      grafana:
        condition: service_started
      mailpit:
        condition: service_started
      kafka:
        condition: service_healthy

  frontend:
    build:
      context: .
      target: frontend
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    environment:
      BACKEND_URL: http://app:8080
    depends_on:
      - app

volumes:
  redis_data:
  mysqldata:
  kafkadata:
