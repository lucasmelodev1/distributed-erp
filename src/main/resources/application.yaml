spring:
  application:
    name: demo
  flyway:
    locations: classpath:db/migrations
    out-of-order: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/${MYSQL_DATABASE:demo}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:mysql}
    hikari:
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  graphql:
    schema:
      introspection:
        enabled: false
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      password: ${SPRING_REDIS_PASSWORD:password}
      port: ${SPRING_REDIS_PORT:6379}
  session:
    data:
      redis:
        flush-mode: on_save
        namespace: spring:session
  mail:
    host: ${SPRING_MAIL_HOST:smtp.resend.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:resend}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
app:
  invitations:
    ttl: 3d
  graphql:
    max-depth: 10
    max-complexity: 200
server:
  servlet:
    session:
      timeout: 30m
management:
  tracing:
    sampling:
          probability: 1.0
  observations:
    http:
      server:
        requests:
          name:
            pattern: "{httpRequestMethod} {httpRoute}"
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://grafana:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://grafana:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://grafana:4318/v1/metrics
logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${SPRING_LOG_SERVICE_NAME:Demo}
        version: ${SPRING_LOG_VERSION:1}
        environment: ${SPRING_PROFILES_ACTIVE:dev}
        node-name: ${SPRING_LOG_NODE_NAME:primary}
---
spring:
  config:
    activate:
      on-profile: dev
  graphql:
    graphiql:
      enabled: true
    schema:
      introspection:
        enabled: true
